<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Errands</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Errands">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --text: #111; --muted: #8a8a8e; --line: #e5e5ea;
    --accent: #0a7cff; --red: #ff3b30; --chip: #eef4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #8e8e93; --line: #2c2c2e;
      --accent: #0a84ff; --red: #ff453a; --chip: #1a2a40;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { position: sticky; top: 0; background: var(--bg); padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left)); z-index: 2; }
  h1 { font-size: 32px; margin: 6px 0 12px; font-weight: 700; letter-spacing: -0.02em; }
  .count { color: var(--muted); font-size: 17px; font-weight: 500; margin-left: 8px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--accent); }
  .add {
    font: inherit; font-weight: 600; padding: 0 16px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff;
  }
  .add:disabled { opacity: .5; }
  main { padding: 0 calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  section { margin-top: 22px; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    font-weight: 600; margin: 0 0 7px 4px; display: flex; gap: 8px; align-items: center;
  }
  h2 .n { font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    border-top: 1px solid var(--line); cursor: pointer; transition: opacity .3s;
  }
  li:first-child { border-top: 0; }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c7c7cc; flex: none;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check::after {
    content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  li.done { opacity: .35; }
  li.done .title { text-decoration: line-through; }
  .title { flex: 1; }
  .tag {
    font-size: 12px; font-weight: 600; color: var(--accent); background: var(--chip);
    padding: 3px 8px; border-radius: 8px; white-space: nowrap;
  }
  .due { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .due.soon { color: var(--red); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); margin-top: 70px; line-height: 1.6; }
  .pending { color: var(--muted); font-style: italic; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 140px);
    background: #2c2c2e; color: #fff; padding: 12px 18px; border-radius: 14px;
    display: flex; gap: 18px; align-items: center; transition: transform .25s;
    font-size: 15px; box-shadow: 0 8px 28px rgba(0,0,0,.28); max-width: calc(100% - 32px);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { background: none; border: 0; color: #64d2ff; font: inherit; font-weight: 600; padding: 0; }
  /* Press and hold an item to change its shop: no text selection or iOS callout */
  li { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  li.pressing { background: var(--line); }
  /* Grocery section headings inside a shop's card */
  li.aisle {
    padding: 10px 14px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); cursor: default;
  }
  li.aisle + li { border-top: 0; }
  .tip { text-align: center; color: var(--muted); font-size: 13px; margin-top: 26px; }
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 5;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); z-index: 6;
    border-radius: 18px 18px 0 0; box-shadow: 0 -8px 28px rgba(0,0,0,.2);
    padding: 18px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    transform: translateY(110%); transition: transform .25s;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-title { font-weight: 600; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 10px; border: 0;
    background: var(--chip); color: var(--accent);
  }
  .chip.current { background: var(--accent); color: #fff; }
  .cancel {
    display: block; width: 100%; margin-top: 12px; font: inherit; font-weight: 600; padding: 12px;
    border: 0; border-radius: 12px; background: var(--bg); color: var(--text);
  }
</style>
</head>
<body>
  <header>
    <h1>Errands<span class="count" id="count"></span></h1>
    <form id="addForm">
      <input id="addInput" placeholder="Add something..." autocomplete="off" enterkeyhint="done">
      <button class="add" id="addBtn">Add</button>
    </form>
  </header>
  <main id="list"><p class="empty">Loading...</p></main>
  <div class="toast" id="toast"><span id="toastText"></span><button id="undo">Undo</button></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="chips" id="chips"></div>
    <form id="shopForm">
      <input id="shopInput" placeholder="Other shop" autocomplete="off" enterkeyhint="done">
      <button class="add">Move</button>
    </form>
    <button class="cancel" id="sheetCancel" type="button">Cancel</button>
  </div>

<script>
  // Data comes from the Errands Apps Script. The key is read from the part of the link after #k=,
  // which browsers never send to GitHub, and remembered on this phone.
  const API = 'https://script.google.com/macros/s/AKfycbw6ndraPCRAMuzAZK0TTrB6KQdKXdx_1W-e3TFUqMUuUEjs4c39mE91OTE2h5MOiAuWnA/exec';
  const fromLink = (location.hash.match(/[#&]k=([0-9a-f]+)/i) || [])[1];
  const store = { // localStorage can be unavailable (private browsing); then the link alone is used
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  if (fromLink) store.set('errandsKey', fromLink);
  const TOKEN = fromLink || store.get('errandsKey') || '';
  const GROUP_FOR_CATEGORY = { 'Buy': 'Buy anywhere', 'Pick up': 'Pick up', 'Do': 'To do', 'Work': 'Work' };
  const LOOSE_ORDER = ['Buy anywhere', 'Pick up', 'To do', 'Work'];
  let tasks = [];
  let pendingText = '';
  let toastTimer, lastDoneId;

  async function call(action, params) {
    const u = new URL(API);
    u.searchParams.set('k', TOKEN);
    u.searchParams.set('action', action);
    Object.keys(params || {}).forEach(k => u.searchParams.set(k, params[k]));
    const res = await fetch(u, { cache: 'no-store', referrerPolicy: 'no-referrer' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }
  const api = {
    listTasks: () => call('list').then(d => d.tasks),
    addTask: text => call('add', { text }).then(d => d.added),
    completeTask: id => call('done', { id }),
    reopenTask: id => call('undo', { id }),
    setStore: (id, store) => call('setstore', { id, store })
  };
  // Grocery sections, in walking order: fresh first, cold things last
  const AISLE_ORDER = ['Produce & fresh', 'Aisles', 'Fridge & frozen'];
  const COMMON_SHOPS = ['Albert', 'Lidl', 'Billa', 'Tesco', 'Kaufland', 'Rohlík', 'dm', 'Rossmann', 'Pharmacy',
    'Post office', 'Zásilkovna', 'IKEA'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function todayStr(offset = 0) {
    const d = new Date(); d.setDate(d.getDate() + offset);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function dueLabel(due) {
    if (!due) return '';
    const today = todayStr(), tomorrow = todayStr(1);
    if (due < today) return '<span class="due soon">Overdue</span>';
    if (due === today) return '<span class="due soon">Today</span>';
    if (due === tomorrow) return '<span class="due">Tomorrow</span>';
    const d = new Date(due + 'T12:00:00');
    return '<span class="due">' + d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }) + '</span>';
  }

  function groupName(t) { return t.store || GROUP_FOR_CATEGORY[t.category] || 'To do'; }

  function render() {
    $('count').textContent = tasks.length ? tasks.length : '';
    const groups = {};
    tasks.forEach(t => (groups[groupName(t)] = groups[groupName(t)] || []).push(t));

    // Shops first (most items on top), then the loose groups in a fixed order
    const shopNames = Object.keys(groups).filter(g => LOOSE_ORDER.indexOf(g) === -1)
      .sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b));
    const order = shopNames.concat(LOOSE_ORDER.filter(g => groups[g]));

    let html = '';
    if (pendingText) {
      html += '<section><h2>Sorting</h2><ul><li><span class="check"></span><span class="title pending">' +
        esc(pendingText) + '</span></li></ul></section>';
    }
    order.forEach(g => {
      // Groceries are grouped by section (fresh, aisles, fridge); everything else keeps due-date order
      const hasAisles = groups[g].some(t => t.aisle);
      const rank = t => { const i = AISLE_ORDER.indexOf(t.aisle); return i < 0 ? AISLE_ORDER.length : i; };
      const items = groups[g].slice().sort((a, b) =>
        (hasAisles ? rank(a) - rank(b) : 0) || ((a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0));
      const isShop = shopNames.indexOf(g) > -1;
      html += '<section><h2>' + esc(g) + ' <span class="n">' + items.length + '</span></h2><ul>';
      let lastAisle = null;
      items.forEach(t => {
        if (hasAisles && (t.aisle || 'Other') !== lastAisle) {
          lastAisle = t.aisle || 'Other';
          html += '<li class="aisle">' + esc(lastAisle) + '</li>';
        }
        const tag = isShop && t.category === 'Pick up' ? '<span class="tag">Pick up</span>' : '';
        html += '<li data-id="' + esc(t.id) + '"><span class="check"></span><span class="title">' +
          esc(t.title) + '</span>' + tag + dueLabel(t.due) + '</li>';
      });
      html += '</ul></section>';
    });
    if (!html) html = '<p class="empty">Nothing on the list.<br>Say "Hey Siri, add errand" to add something.</p>';
    else html += '<p class="tip">Press and hold an item to change its shop.</p>';
    $('list').innerHTML = html;
  }

  // ---------- Change a task's shop (press and hold) ----------
  let movingId = null;

  function openShopSheet(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    movingId = id;
    $('sheetTitle').textContent = 'Move "' + task.title + '" to';
    const shops = [];
    tasks.forEach(t => { if (t.store && shops.indexOf(t.store) < 0) shops.push(t.store); });
    COMMON_SHOPS.forEach(s => { if (shops.indexOf(s) < 0) shops.push(s); });
    $('chips').innerHTML = shops.map(s => '<button type="button" class="chip' + (s === task.store ? ' current' : '') +
      '" data-shop="' + esc(s) + '">' + esc(s) + '</button>').join('') +
      '<button type="button" class="chip' + (!task.store ? ' current' : '') + '" data-shop="">No shop</button>';
    $('shopInput').value = '';
    $('backdrop').classList.add('show');
    $('sheet').classList.add('show');
  }

  function closeShopSheet() {
    movingId = null;
    $('shopInput').blur();
    $('backdrop').classList.remove('show');
    $('sheet').classList.remove('show');
  }

  async function moveTo(store) {
    const id = movingId;
    const task = tasks.find(t => t.id === id);
    closeShopSheet();
    if (!task || task.store === store) return;
    const before = task.store;
    task.store = store; render(); // show it right away, save in the background
    showToast(store ? 'Moved to ' + store : 'Removed the shop');
    try { await api.setStore(id, store); }
    catch (e) { task.store = before; render(); showToast('Could not move it. Try again.'); }
  }

  $('chips').addEventListener('click', e => {
    const b = e.target.closest('[data-shop]');
    if (b) moveTo(b.dataset.shop);
  });
  $('shopForm').addEventListener('submit', e => {
    e.preventDefault();
    const s = $('shopInput').value.trim();
    if (s) moveTo(s);
  });
  $('sheetCancel').addEventListener('click', closeShopSheet);
  $('backdrop').addEventListener('click', closeShopSheet);

  let pressTimer = null, longPressed = false, pressLi = null, startX = 0, startY = 0;
  function cancelPress() {
    clearTimeout(pressTimer);
    if (pressLi) pressLi.classList.remove('pressing');
    pressLi = null;
  }
  $('list').addEventListener('touchstart', e => {
    const li = e.target.closest('li[data-id]');
    longPressed = false;
    if (!li || li.classList.contains('done')) return;
    pressLi = li;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    li.classList.add('pressing');
    pressTimer = setTimeout(() => {
      longPressed = true;
      const id = li.dataset.id;
      cancelPress();
      if (navigator.vibrate) navigator.vibrate(10);
      openShopSheet(id);
    }, 500);
  }, { passive: true });
  $('list').addEventListener('touchmove', e => {
    if (pressLi && (Math.abs(e.touches[0].clientX - startX) > 10 || Math.abs(e.touches[0].clientY - startY) > 10)) cancelPress();
  }, { passive: true });
  $('list').addEventListener('touchend', cancelPress);
  $('list').addEventListener('touchcancel', cancelPress);
  // On a computer: right-click an item
  $('list').addEventListener('contextmenu', e => {
    const li = e.target.closest('li[data-id]');
    if (!li) return;
    e.preventDefault();
    openShopSheet(li.dataset.id);
  });

  async function load() {
    if (!TOKEN) { $('list').innerHTML = '<p class="empty">Open this page from your Errands link<br>(the one that ends in #k=...).</p>'; return; }
    try { tasks = await api.listTasks(); render(); }
    catch (e) { $('list').innerHTML = '<p class="empty">Could not load the list.<br>' + esc(e.message || e) + '</p>'; }
  }

  function showToast(text, undoable) {
    $('toastText').textContent = text;
    $('undo').style.display = undoable ? '' : 'none';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
  }

  $('list').addEventListener('click', e => {
    if (longPressed) { longPressed = false; return; } // a press-and-hold is not a tap
    const li = e.target.closest('li[data-id]');
    if (!li || li.classList.contains('done')) return;
    const id = li.dataset.id;
    const task = tasks.find(t => t.id === id);
    li.classList.add('done');
    lastDoneId = id;
    api.completeTask(id).catch(() => { showToast('Could not save. Try again.'); load(); });
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      render();
      showToast('Done: ' + (task ? task.title : ''), true);
    }, 450);
  });

  $('undo').addEventListener('click', async () => {
    $('toast').classList.remove('show');
    if (!lastDoneId) return;
    await api.reopenTask(lastDoneId);
    lastDoneId = null;
    load();
  });

  let adding = false;
  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('addInput').value.trim();
    if (!text || adding) return; // one save at a time, so a double tap can't add it twice
    adding = true;
    $('addBtn').disabled = true;
    $('addBtn').textContent = 'Adding...';
    $('addInput').value = '';
    $('addInput').blur();
    pendingText = text; render();
    try {
      const added = await api.addTask(text);
      tasks = tasks.concat(added);
    } catch (err) {
      showToast('Could not add. Try again.');
    }
    pendingText = ''; render();
    adding = false;
    $('addBtn').disabled = false;
    $('addBtn').textContent = 'Add';
  });

  // Refresh when you come back to the page from the home screen
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  load();
</script>
</body>
</html>
