<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THOR</title>
<!-- Home-screen launcher for THOR, a private budget dashboard (Google Apps Script, Google sign-in required).
     Opened normally it goes straight to the dashboard. Opened with #add it stays here so you can add it
     to the home screen with this icon; the #add is removed first, so the saved shortcut goes straight through. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="THOR">
<meta name="theme-color" content="#1b1440">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1440; color: #ecebf8;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  h1 { font-size: 28px; letter-spacing: .08em; margin: 18px 0 6px; }
  p { color: #b9b4e6; max-width: 320px; margin: 8px auto; }
  a { color: #f6be48; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="THOR icon">
  <h1>THOR</h1>
  <p id="go">Opening THOR…</p>
  <div id="add" hidden>
    <p>To put THOR on your home screen, tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
    <p><a id="open" href="#">Open THOR now</a></p>
  </div>
</main>
<script>
  var DASHBOARD = 'https://script.google.com/macros/s/AKfycbxRq5v4uWxOEAMKNoGjAbkKcA6St_jrnKn7mPBQsoTFpmgpF5K8XotQIKFX_F8s0AwOuw/exec';
  document.getElementById('open').href = DASHBOARD;
  if (location.hash === '#add') {
    document.getElementById('add').hidden = false;
    document.getElementById('go').hidden = true;
    history.replaceState(null, '', location.pathname); // the saved shortcut opens THOR directly
  } else {
    location.replace(DASHBOARD);
  }
</script>
</body>
</html>
