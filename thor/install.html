<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install THOR</title>
<!-- Installs THOR.mobileconfig (a home-screen Web Clip with the THOR icon). GitHub Pages serves the file as a
     generic download, so the button hands it to Safari as a configuration profile instead. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1440; color: #ecebf8;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 110px; height: 110px; border-radius: 24px; }
  h1 { font-size: 24px; margin: 16px 0 4px; }
  p { color: #b9b4e6; max-width: 330px; margin: 8px auto; }
  button { font: inherit; font-weight: 600; font-size: 17px; margin-top: 14px; padding: 12px 26px; border: 0; border-radius: 12px; background: #f6be48; color: #1b1440; }
  #msg { min-height: 1.5em; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="THOR icon">
  <h1>Install THOR</h1>
  <p>Open this page in Safari on your iPhone and tap the button. Then go to <b>Settings</b>, tap <b>Profile Downloaded</b>, and <b>Install</b>.</p>
  <button id="go">Install THOR</button>
  <p id="msg"></p>
</main>
<script>
  document.getElementById('go').onclick = function () {
    var msg = document.getElementById('msg');
    msg.textContent = 'Loading…';
    fetch('THOR.mobileconfig', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function (buf) {
        var blob = new Blob([buf], { type: 'application/x-apple-aspen-config' });
        location.href = URL.createObjectURL(blob);
        msg.textContent = 'If Safari asked to allow a configuration profile, tap Allow, then open Settings.';
      })
      .catch(function (e) { msg.textContent = 'Could not load the profile: ' + e.message; });
  };
</script>
</body>
</html>
